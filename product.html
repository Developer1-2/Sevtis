<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Sevtis</title>
  <meta name="description" content="Sevtis security equipment details.">
  <link rel="stylesheet" href="sevtis-styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <style>
    .detail-page {
      padding: 36px 5% 64px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .detail-back {
      display: inline-block;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #007bff;
      text-decoration: none;
    }
    .detail-back:hover {
      text-decoration: underline;
    }
    .detail-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.75rem;
    }
    @media (min-width: 800px) {
      .detail-layout {
        grid-template-columns: 1fr 1.1fr;
        gap: 2.5rem;
        align-items: start;
      }
    }
    .detail-image {
      background: #f4f4f4;
      border-radius: 12px;
      border: 1px solid #e8e8e8;
      overflow: hidden;
      aspect-ratio: 4/3;
    }
    .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .detail-cat {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #007bff;
      margin-bottom: 0.4rem;
    }
    .detail-layout h1 {
      font-size: clamp(1.4rem, 3vw, 1.85rem);
      line-height: 1.25;
      margin-bottom: 0.35rem;
      color: #111;
    }
    .detail-model {
      font-size: 0.95rem;
      color: #777;
      margin-bottom: 1rem;
    }
    .detail-summary {
      font-size: 1.05rem;
      color: #333;
      line-height: 1.55;
      margin-bottom: 1rem;
    }
    .detail-body {
      font-size: 0.98rem;
      color: #444;
      line-height: 1.7;
      margin-bottom: 1.25rem;
    }
    .detail-specs {
      background: #f8f9fb;
      border-radius: 10px;
      padding: 1rem 1.15rem;
      margin-bottom: 1.35rem;
    }
    .detail-specs h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #555;
      margin-bottom: 0.65rem;
    }
    .detail-specs ul {
      margin: 0;
      padding-left: 1.1rem;
    }
    .detail-specs li {
      margin-bottom: 0.35rem;
      color: #333;
      font-size: 0.95rem;
    }
    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-whatsapp-lg {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25d366;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .btn-whatsapp-lg:hover {
      background: #1ebe57;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #ddd;
      text-decoration: none;
      font-weight: 600;
      color: #111;
      font-size: 0.95rem;
    }
    .btn-secondary:hover {
      border-color: #007bff;
      color: #007bff;
    }
    .detail-error {
      padding: 3rem 0;
      text-align: center;
      color: #555;
    }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="top-bar">
      <div class="top-bar-inner">
        <a href="tel:+256768381442" class="header-phone">0768 381 442</a>
        <div class="social-links">
         <a href="https://wa.me/256768381442" target="_blank" rel="noopener">
            <i class="bi bi-whatsapp"></i> WhatsApp
          </a>
          <a href="https://linkedin.com/company/sevtis" target="_blank" rel="noopener">
            <i class="bi bi-linkedin"></i> LinkedIn
          </a>
          <a href="https://instagram.com/sevtis" target="_blank" rel="noopener">
            <i class="bi bi-instagram"></i> Instagram
          </a>
          <a href="https://facebook.com/sevtis" target="_blank" rel="noopener">
            <i class="bi bi-facebook"></i> Facebook
          </a>
        </div>
      </div>
    </div>
    <nav class="nav-bars">
      <div class="logo-sec">
        <a href="index.html" class="logo">Sevtis</a>
      </div>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">Menu</button>
      <div class="nav-links" id="navLinks">
        <a href="index.html#solutions">Solutions</a>
        <a href="products.html">Products</a>
        <a href="#">Support</a>
        <a href="https://wa.me/256768381442?text=Hi%2C%20I%27d%20like%20a%20quote" class="nav-cta" target="_blank" rel="noopener">Get a Quote</a>
      </div>
    </nav>
  </header>

  <main class="detail-page" id="detailRoot">
    <p>Loading product…</p>
  </main>

  <footer class="footer-tag">
    <div>
      <h3>Quick Links</h3>
      <a href="https://wa.me/256768381442" target="_blank" rel="noopener">WhatsApp</a>
      <a href="products.html">Products</a>
    </div>
    <div>
      <h3>Contact</h3>
      <p class="footer-phone"><a href="tel:+256768381442">0768 381 442</a></p>
    </div>
    <div>
      <h3>About</h3>
      <p>Sevtis security solutions — CCTV, access control, and alarms.</p>
    </div>
  </footer>

  <script>
  (function () {
    const root = document.getElementById('detailRoot');
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
      menuToggle.addEventListener('click', function () {
        navLinks.classList.toggle('open');
      });
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || '';
    }

    fetch('products.json')
      .then(function (r) {
        if (!r.ok) throw new Error('fail');
        return r.json();
      })
      .then(function (data) {
        const id = getId();
        const product = (data.products || []).find(function (p) { return p.id === id; });
        const wa = data.whatsapp || '256768381442';
        const categories = data.categories || [];

        if (!product) {
          root.innerHTML = '<div class="detail-error"><p>Product not found.</p><p><a class="detail-back" href="products.html">← Back to products</a></p></div>';
          return;
        }

        const cat = categories.find(function (c) { return c.id === product.category; });
        const catLabel = cat ? cat.name : product.category;
        const waText = "Hi, I'm interested in the " + product.name + " (" + product.model + ")";
        const waHref = 'https://wa.me/' + wa + '?text=' + encodeURIComponent(waText);

        document.title = product.name + ' — Sevtis';

        const specs = (product.specs || []).map(function (s) {
          return '<li>' + esc(s) + '</li>';
        }).join('');

        root.innerHTML =
          '<a class="detail-back" href="products.html">← All products</a>' +
          '<div class="detail-layout">' +
            '<div class="detail-image">' +
              '<img src="' + esc(product.image) + '" alt="' + esc(product.name) + '" onerror="this.style.opacity=0.35">' +
            '</div>' +
            '<div>' +
              '<div class="detail-cat">' + esc(catLabel) + '</div>' +
              '<h1>' + esc(product.name) + '</h1>' +
              '<div class="detail-model">Model: ' + esc(product.model) + '</div>' +
              '<p class="detail-summary">' + esc(product.summary) + '</p>' +
              '<div class="detail-body">' + esc(product.description) + '</div>' +
              (specs ? '<div class="detail-specs"><h2>Key specifications</h2><ul>' + specs + '</ul></div>' : '') +
              '<div class="detail-actions">' +
                '<a class="btn-whatsapp-lg" href="' + waHref + '" target="_blank" rel="noopener">Chat on WhatsApp</a>' +
                '<a class="btn-secondary" href="products.html">Browse more</a>' +
              '</div>' +
            '</div>' +
          '</div>';
      })
      .catch(function () {
        root.innerHTML = '<div class="detail-error"><p>Unable to load product.</p><a class="detail-back" href="products.html">← Back to products</a></div>';
      });
  })();
  </script>
</body>
</html>
